repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.12.7
    hooks:
      - id: ruff

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.0
    hooks:
      - id: mypy
        args: ["--config-file=mypy.ini"]
        additional_dependencies:
          - types-seaborn
          - pandas-stubs

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-black
        args: ["--line-length=88"]
      - id: nbqa-ruff
      - id: nbqa-mypy
        args: ["--config-file=mypy.ini"]
        additional_dependencies:
          - mypy
          - types-seaborn
          - pandas-stubs

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.3
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        name: bandit-security-scan
        args: ["-r", "."]

  - repo: local
    hooks:
      - id: safety
        name: safety-security-scan
        entry: poetry run safety check
        language: system
        types: [python]
        stages: [manual]

      - id: pip-audit
        name: pip-audit-vulnerability-scan
        entry: poetry run pip-audit
        language: system
        types: [python]
        stages: [manual]
